<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Food - Food Voting</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header>
    <h1>Food Voting</h1>
    <nav>
        <a href="/">Home</a>
        <a href="/results">Results</a>
        <a href="/food/new">Add Food</a>
    </nav>
</header>

<div class="container">
    <h2 style="margin-bottom: 1.5rem;">Add a Food Item</h2>

    <div class="form-container">
        <form action="/food/new" method="post" th:object="${foodItem}">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required placeholder="e.g. Pizza Margherita">
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="3" placeholder="Describe the dish..."></textarea>
            </div>
            <div class="form-group">
                <label for="category">Category</label>
                <input type="text" id="category" name="category" placeholder="e.g. Italian, Japanese">
            </div>
            <div class="form-group">
                <label for="imageUrl">Image URL</label>
                <input type="text" id="imageUrl" name="imageUrl" placeholder="https://example.com/image.jpg">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Add Food Item</button>
        </form>
    </div>

    <div style="text-align: center; margin-top: 1.5rem;">
        <a href="/" class="btn btn-secondary">Cancel</a>
    </div>
</div>

<footer>
    <p>Food Voting App</p>
</footer>
</body>
</html>
